<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hanored Photography — Hassan Kah</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C8A96B;--bg:#0b0b0b;--card:#1F1F1F;--border:#2A2A2A;--fg:#F5F5F5;--muted:#9A9A9A}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:'Poppins',sans-serif;overflow-x:hidden}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
.pf{font-family:'Playfair Display',serif}
.gold{color:var(--gold)}
.label{font-family:'Poppins',sans-serif;font-size:11px;font-weight:500;letter-spacing:.25em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:0 5%;transition:all .4s}
nav.scrolled{background:rgba(11,11,11,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
.nav-brand{font-family:'Playfair Display',serif;color:var(--gold);font-size:18px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.nav-links{display:flex;gap:26px;align-items:center}
.nav-links button{background:none;border:none;cursor:pointer;color:var(--muted);font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;transition:color .2s;border-bottom:1px solid transparent;padding-bottom:2px}
.nav-links button:hover,.nav-links button.active{color:var(--gold);border-bottom-color:var(--gold)}
.nav-cta{background:none!important;border:1.5px solid var(--gold)!important;color:var(--gold)!important;padding:7px 18px!important;border-radius:4px!important;border-bottom:1.5px solid var(--gold)!important;transition:all .2s!important}
.nav-cta:hover{background:var(--gold)!important;color:var(--bg)!important}
.ham{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:4px}
.ham span{display:block;width:22px;height:2px;background:var(--gold);transition:all .3s;border-radius:1px}
.mob-menu{display:none;background:rgba(11,11,11,.98);border-top:1px solid var(--border);padding:14px 0}
.mob-menu button{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;color:var(--fg);font-family:'Poppins',sans-serif;font-size:15px;padding:10px 20px}
.mob-menu .mcta{margin:10px 20px;border:1.5px solid var(--gold);color:var(--gold);border-radius:4px;width:auto;display:inline-block;padding:9px 18px;font-weight:600}

/* HERO */
#hero{position:relative;height:100vh;min-height:580px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transition:transform 10s ease-out}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,11,11,.55) 0%,rgba(11,11,11,.3) 40%,rgba(11,11,11,.78) 100%)}
.hero-content{position:relative;z-index:2;text-align:center;padding:0 24px;max-width:820px;opacity:0;transform:translateY(24px);transition:opacity 1.1s ease .2s,transform 1.1s cubic-bezier(.23,1,.32,1) .2s}
.hero-content.show{opacity:1;transform:none}
.hero-title{font-size:clamp(2.1rem,6vw,4.5rem);font-weight:700;line-height:1.13;margin-bottom:18px;text-shadow:0 2px 40px rgba(0,0,0,.6)}
.hero-sub{color:var(--gold);font-family:'Poppins',sans-serif;font-size:clamp(12px,2vw,14px);letter-spacing:.14em;margin-bottom:42px}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.scroll-line{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:2;opacity:0;transition:opacity 1s ease 1.6s}
.scroll-line.show{opacity:1}
.scroll-line div{width:1px;height:55px;background:linear-gradient(to bottom,transparent,var(--gold));margin:0 auto;animation:spulse 2s ease-in-out infinite}

/* BUTTONS */
.btn-gold{background:transparent;border:1.5px solid var(--gold);color:var(--gold);padding:12px 26px;border-radius:4px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;transition:all .25s;display:inline-flex;align-items:center;gap:8px}
.btn-gold:hover{background:var(--gold);color:var(--bg);transform:scale(1.02)}
.btn-out{background:transparent;border:1.5px solid rgba(245,245,245,.4);color:rgba(245,245,245,.75);padding:12px 26px;border-radius:4px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:14px;font-weight:500;transition:all .25s;display:inline-flex;align-items:center;gap:8px}
.btn-out:hover{border-color:rgba(245,245,245,1);color:var(--fg);transform:scale(1.02)}
.btn-full{width:100%;justify-content:center}

/* SECTIONS */
section{padding:90px 5%}
.sec-label{text-align:center;margin-bottom:10px}
.sec-title{font-size:clamp(1.9rem,5vw,3rem);text-align:center;color:var(--fg);margin-bottom:50px}
.container{max-width:1200px;margin:0 auto}

/* PORTFOLIO */
#portfolio{background:var(--bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:44px}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 17px;border-radius:20px;cursor:pointer;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;transition:all .2s}
.filter-btn:hover,.filter-btn.active{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.masonry{columns:3 250px;gap:10px}
.porto-item{break-inside:avoid;margin-bottom:10px;position:relative;overflow:hidden;border-radius:4px;cursor:pointer;opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s cubic-bezier(.23,1,.32,1)}
.porto-item.show{opacity:1;transform:none}
.porto-item img{width:100%;display:block;transition:transform .5s,filter .5s;min-height:160px;object-fit:cover}
.porto-item:hover img{transform:scale(1.06);filter:brightness(.6)}
.porto-cat{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:linear-gradient(to top,rgba(0,0,0,.65),transparent);transition:opacity .3s}
.porto-item:hover .porto-cat{opacity:0}
.porto-cat span{color:var(--gold);font-size:10px;font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.porto-hover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
.porto-item:hover .porto-hover{opacity:1}
.porto-hover p{color:var(--fg);font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;margin-top:8px;text-align:center}

/* LIGHTBOX */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200;align-items:center;justify-content:center}
.lightbox.open{display:flex}
.lb-close{position:absolute;top:18px;right:18px;background:none;border:none;cursor:pointer;color:var(--fg);font-size:26px;line-height:1}
.lb-img{max-width:90vw;max-height:84vh;object-fit:contain;border-radius:4px}
.lb-label{color:var(--gold);text-align:center;margin-top:10px;font-family:'Poppins',sans-serif;font-size:14px}

/* WAVE */
.wave{line-height:0}
.wave svg{width:100%;height:50px;display:block}

/* AFRICA MODERN */
#africa{background:var(--card)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:68px;align-items:center}
.img-frame{position:relative;border-radius:4px;overflow:hidden}
.img-frame img{width:100%;height:560px;object-fit:cover}
.img-frame-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(200,169,107,.1),transparent)}
.img-accent{position:absolute;bottom:-10px;right:-10px;width:70px;height:200px;border:1px solid var(--gold);border-radius:2px;opacity:.3}
.line-accent{position:absolute;top:20px;left:-12px;width:3px;height:110px;background:linear-gradient(to bottom,var(--gold),transparent)}

/* ABOUT */
#about{background:var(--bg)}
.sig-row{display:flex;align-items:center;gap:18px;margin-bottom:34px}
.sig-line{height:1px;flex:1;background:linear-gradient(to right,rgba(200,169,107,.4),transparent)}
.logo-box{width:88px;height:52px;background:#fff;border-radius:3px;padding:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-box img{width:100%;height:100%;object-fit:contain}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:22px 0;margin-bottom:34px}
.stat{text-align:center}
.stat-val{font-family:'Playfair Display',serif;color:var(--gold);font-size:30px;font-weight:700}
.stat-lbl{color:var(--muted);font-family:'Poppins',sans-serif;font-size:12px;margin-top:4px}

/* SERVICES */
#services{background:var(--card)}
.srv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.srv-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:28px 26px;transition:border-color .3s,transform .4s;opacity:0;transform:translateY(22px)}
.srv-card.show{opacity:1;transform:none}
.srv-card:hover{border-color:var(--gold);transform:scale(1.03) translateY(-4px)}
.srv-icon{width:42px;height:42px;border-radius:50%;background:rgba(200,169,107,.1);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.srv-icon svg{width:19px;height:19px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srv-card h3{font-family:'Playfair Display',serif;color:var(--fg);font-size:19px;margin-bottom:9px}
.srv-card p{color:var(--muted);font-family:'Poppins',sans-serif;font-size:14px;line-height:1.82}
.srv-line{margin-top:20px;height:1px;background:transparent;transition:background .4s}
.srv-card:hover .srv-line{background:linear-gradient(to right,var(--gold),transparent)}

/* TESTIMONIALS */
#testimonials{background:var(--bg)}
.tst-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.tst-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:28px 24px;opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s cubic-bezier(.23,1,.32,1)}
.tst-card.show{opacity:1;transform:none}
.stars{display:flex;gap:3px;margin-bottom:12px}
.stars svg{width:13px;height:13px;fill:var(--gold);stroke:none}
.tst-text{color:var(--muted);font-family:'Poppins',sans-serif;font-size:14px;line-height:1.88;font-style:italic;margin-bottom:20px}
.tst-author{display:flex;align-items:center;gap:12px}
.tst-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,rgba(200,169,107,.6),rgba(200,169,107,.3));display:flex;align-items:center;justify-content:center;border:2px solid var(--gold);flex-shrink:0}
.tst-avatar span{font-family:'Playfair Display',serif;color:var(--gold);font-size:14px;font-weight:700}
.tst-name{color:var(--fg);font-family:'Poppins',sans-serif;font-size:14px;font-weight:600}
.tst-role{color:var(--gold);font-family:'Poppins',sans-serif;font-size:12px}

/* CONTACT */
#contact{background:var(--card)}
.cnt-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:52px}
.cnt-desc{color:var(--muted);font-family:'Poppins',sans-serif;font-size:15px;line-height:1.85;margin-bottom:30px}
.cnt-cards{display:flex;flex-direction:column;gap:12px}
.cnt-card{display:flex;align-items:center;gap:13px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:13px 16px;text-decoration:none;transition:border-color .3s,transform .3s}
.cnt-card:hover{border-color:var(--gold);transform:translateX(6px)}
.cnt-card-icon{width:34px;height:34px;border-radius:50%;background:rgba(200,169,107,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnt-card-icon svg{width:15px;height:15px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cnt-card-lbl{color:var(--muted);font-family:'Poppins',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.cnt-card-val{color:var(--fg);font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .3s;margin-top:2px}
.cnt-card:hover .cnt-card-val{color:var(--gold)}
.social-row{margin-top:34px}
.social-lbl{color:var(--muted);font-family:'Poppins',sans-serif;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:12px}
.social-btns{display:flex;gap:9px}
.social-btn{display:flex;align-items:center;gap:7px;color:var(--muted);font-family:'Poppins',sans-serif;font-size:13px;border:1px solid var(--border);border-radius:4px;padding:7px 13px;transition:all .2s;text-decoration:none}
.social-btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.social-btn:hover{border-color:var(--gold);color:var(--gold)}
.form-box{background:var(--bg);border-radius:6px;padding:36px;border:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.form-group{margin-bottom:0}
.form-group label{display:block;color:var(--muted);font-family:'Poppins',sans-serif;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--card);border:1px solid var(--border);color:var(--fg);border-radius:4px;padding:10px 12px;font-family:'Poppins',sans-serif;font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold)}
.form-group textarea{resize:vertical}
.form-mb{margin-bottom:13px}
.form-mb2{margin-bottom:20px}
.success-box{background:var(--bg);border:1px solid var(--gold);border-radius:6px;padding:46px;text-align:center}
.success-box svg{width:42px;height:42px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin:0 auto 16px}
.success-box h3{font-family:'Playfair Display',serif;color:var(--gold);font-size:22px;margin-bottom:8px}
.success-box p{color:var(--muted);font-family:'Poppins',sans-serif;font-size:15px}

/* FOOTER */
footer{background:#070707;border-top:1px solid var(--border);padding:58px 5% 26px}
.ftr-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:40px;margin-bottom:40px}
.ftr-brand{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.ftr-logo{width:52px;height:34px;background:#fff;border-radius:3px;padding:3px;display:flex;align-items:center;justify-content:center}
.ftr-logo img{width:100%;height:100%;object-fit:contain}
.ftr-brand-name{font-family:'Playfair Display',serif;color:var(--gold);font-size:16px}
.ftr-desc{color:var(--muted);font-family:'Poppins',sans-serif;font-size:14px;line-height:1.82;margin-bottom:10px}
.ftr-loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-family:'Poppins',sans-serif;font-size:13px}
.ftr-loc svg{width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ftr-col h4{color:var(--fg);font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.ftr-col button{display:block;background:none;border:none;cursor:pointer;color:var(--muted);font-family:'Poppins',sans-serif;font-size:14px;padding:3px 0;transition:color .2s;text-align:left}
.ftr-col button:hover{color:var(--gold)}
.ftr-col p,.ftr-col a{color:var(--muted);font-family:'Poppins',sans-serif;font-size:14px;padding:3px 0;display:block}
.ftr-contact a{display:flex;align-items:center;gap:7px;color:var(--muted);font-family:'Poppins',sans-serif;font-size:13px;margin-bottom:6px;word-break:break-all}
.ftr-contact a svg{width:11px;height:11px;stroke:var(--gold);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ftr-bottom{border-top:1px solid var(--border);padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.ftr-copy{color:var(--muted);font-family:'Poppins',sans-serif;font-size:12px}
.ftr-links{display:flex;gap:20px}
.ftr-links span{color:var(--muted);font-family:'Poppins',sans-serif;font-size:11px;cursor:pointer}

/* FLOAT */
.float-wrap{position:fixed;bottom:24px;right:20px;z-index:150;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.float-sub{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:40px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;text-decoration:none;animation:slu .3s ease;white-space:nowrap}
.float-sub svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.float-wa{background:#25D366;color:#fff;box-shadow:0 4px 20px rgba(37,211,102,.4)}
.float-ph{background:var(--gold);color:var(--bg);box-shadow:0 4px 20px rgba(200,169,107,.4)}
.float-btn{width:54px;height:54px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;animation:glow2 2.2s infinite;transition:transform .3s;box-shadow:0 4px 24px rgba(200,169,107,.5)}
.float-btn svg{width:20px;height:20px;stroke:var(--bg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.float-btn.open{transform:rotate(45deg) scale(1.08)}

/* FADE IN */
.fade{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s cubic-bezier(.23,1,.32,1)}
.fade.from-left{transform:translateX(-28px)}
.fade.from-right{transform:translateX(28px)}
.fade.show{opacity:1;transform:none}

/* ANIMATIONS */
@keyframes spulse{0%,100%{opacity:.25;transform:scaleY(.75)}50%{opacity:1;transform:scaleY(1)}}
@keyframes glow2{0%,100%{box-shadow:0 0 0 0 rgba(200,169,107,.55)}55%{box-shadow:0 0 0 16px rgba(200,169,107,0)}}
@keyframes slu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* RESPONSIVE */
@media(max-width:900px){
  .ftr-grid{grid-template-columns:1fr 1fr}
  .srv-grid{grid-template-columns:repeat(2,1fr)}
  .cnt-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .nav-links{display:none}
  .ham{display:flex}
  .two-col{grid-template-columns:1fr;gap:36px}
  .tst-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .srv-grid{grid-template-columns:1fr}
  .ftr-grid{grid-template-columns:1fr}
  .form-row{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>
<body>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()">✕</button>
  <div onclick="event.stopPropagation()">
    <img class="lb-img" id="lb-img" src="" alt=""/>
    <p class="lb-label" id="lb-label"></p>
  </div>
</div>

<!-- NAVBAR -->
<nav id="navbar">
  <div class="nav-inner">
    <div class="nav-brand" onclick="scrollTo('hero')">Hanored Photography</div>
    <div class="nav-links" id="navlinks">
      <button onclick="scrollTo('hero')" class="active" data-nav="hero">Accueil</button>
      <button onclick="scrollTo('portfolio')" data-nav="portfolio">Portfolio</button>
      <button onclick="scrollTo('services')" data-nav="services">Services</button>
      <button onclick="scrollTo('about')" data-nav="about">À propos</button>
      <button onclick="scrollTo('testimonials')" data-nav="testimonials">Témoignages</button>
      <button onclick="scrollTo('contact')" data-nav="contact">Contact</button>
      <button class="nav-cta" onclick="scrollTo('contact')">Réserver</button>
    </div>
    <button class="ham" id="ham" onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>
  </div>
  <div class="mob-menu" id="mobmenu">
    <button onclick="scrollTo('hero');toggleMenu()">Accueil</button>
    <button onclick="scrollTo('portfolio');toggleMenu()">Portfolio</button>
    <button onclick="scrollTo('services');toggleMenu()">Services</button>
    <button onclick="scrollTo('about');togg
